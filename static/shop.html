<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试购买 - 电商智能客服 Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #eef1f5; min-height: 100vh; }
    header {
      background: #2b6de8; color: #fff; padding: 14px 20px; font-size: 17px; font-weight: bold;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: normal; }
    .top-actions button {
      padding: 6px 14px; border: 1px solid rgba(255,255,255,.7); border-radius: 14px;
      background: transparent; color: #fff; font-size: 13px; cursor: pointer;
    }
    .top-actions a { color: #fff; text-decoration: underline; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h2 { font-size: 16px; margin-bottom: 14px; color: #333; }
    .notice {
      min-height: 20px; text-align: center; font-size: 13px; color: #c0392b; margin: 12px 0 0;
    }
    .notice.ok { color: #1d7a4d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card {
      background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .card .name { font-size: 15px; color: #333; }
    .card .price { font-size: 18px; color: #c0392b; font-weight: bold; }
    .card button { width: 100%; }
    button {
      padding: 9px 18px; border: none; border-radius: 18px; background: #2b6de8;
      color: #fff; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .order-item {
      background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .order-item:hover { border-color: #2b6de8; }
    .order-item .no { font-size: 14px; color: #333; }
    .order-item .meta { font-size: 12px; color: #777; margin-top: 4px; }
    .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #eef1f5; color: #555; white-space: nowrap; }
    .empty { color: #777; font-size: 14px; background: #fff; border: 1px dashed #ccc; border-radius: 10px; padding: 20px; text-align: center; }
    .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; }
    [hidden] { display: none !important; }
    .modal-card { background: #fff; border-radius: 14px; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; padding: 20px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-head h3 { font-size: 16px; }
    .modal-head button { background: #eef1f5; color: #555; padding: 5px 12px; font-size: 12px; }
    #modal-info { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 12px; }
    .timeline { list-style: none; border-left: 2px solid #dce6f7; margin: 0 0 18px 6px; padding: 0 0 0 16px; }
    .timeline li { font-size: 13px; color: #333; padding: 6px 0; line-height: 1.5; }
    .timeline li .time { color: #999; font-size: 12px; display: block; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-actions button { flex: 1; min-width: 90px; font-size: 13px; padding: 9px 8px; }
  </style>
</head>
<body>
  <header>
    <span>商品测试页</span>
    <div class="top-actions">
      <button id="logistics-btn" type="button">修改物流</button>
      <a href="/">返回聊天</a>
    </div>
  </header>

  <p id="notice" class="notice"></p>

  <main>
    <section id="products-view">
      <h2>商品列表</h2>
      <div id="product-list" class="grid"></div>
    </section>

    <section id="orders-view" hidden>
      <h2>我的订单（点击条目查看物流）</h2>
      <div id="order-list" class="list"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">订单物流</h3>
        <button id="modal-close" type="button">关闭</button>
      </div>
      <p id="modal-info"></p>
      <ul id="timeline" class="timeline"></ul>
      <div class="modal-actions">
        <button id="btn-ship" type="button">发货</button>
        <button id="btn-transit" type="button">物流中转</button>
        <button id="btn-sign" type="button">已签收</button>
      </div>
    </div>
  </div>

  <!-- 带版本号：避免浏览器命中旧的缓存副本 -->
  <script src="/static/shop.js?v=2"></script>
</body>
</html>
